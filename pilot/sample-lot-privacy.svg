<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <!-- Demo frame for the privacy redaction pass: same bay geometry as
       sample-lot.svg (so sample-spots.json still lines up and occupancy still
       computes) but with pedestrian faces and Israeli yellow plates planted in
       it. Loading this frame in pilot-kit.html must show them blurred. -->
  <rect width="800" height="480" fill="#4d5560"/>
  <rect x="20" y="16" width="760" height="448" fill="#5c6570"/>
  <text x="400" y="26" text-anchor="middle" fill="#c5ccd4" font-size="13" font-family="Segoe UI, Arial, sans-serif">דוגמה — מגרש עם פנים ולוחיות (מסונתז). חייב להופיע מטושטש.</text>
  <!-- bay lines -->
  <g fill="none" stroke="#d7dde4" stroke-width="2">
    <rect x="50" y="36" width="108" height="168"/>
    <rect x="174" y="36" width="108" height="168"/>
    <rect x="298" y="36" width="108" height="168"/>
    <rect x="422" y="36" width="108" height="168"/>
    <rect x="546" y="36" width="108" height="168"/>
    <rect x="670" y="36" width="108" height="168"/>
    <rect x="50" y="276" width="108" height="168"/>
    <rect x="174" y="276" width="108" height="168"/>
    <rect x="298" y="276" width="108" height="168"/>
    <rect x="422" y="276" width="108" height="168"/>
    <rect x="546" y="276" width="108" height="168"/>
    <rect x="670" y="276" width="108" height="168"/>
  </g>
  <!-- aisle -->
  <rect x="20" y="220" width="760" height="40" fill="#454c55"/>
  <line x1="40" y1="240" x2="760" y2="240" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="10 8"/>
  <!-- cars, each with a yellow rear plate facing the camera -->
  <g>
    <rect x="58" y="52" width="92" height="136" rx="10" fill="#1c1f28"/>
    <rect x="64" y="70" width="80" height="36" rx="4" fill="#2e3544"/>
    <rect x="68" y="150" width="72" height="26" rx="3" fill="#f2d02c"/>
    <g fill="#181818">
      <rect x="74" y="156" width="7" height="14"/><rect x="84" y="156" width="7" height="14"/>
      <rect x="96" y="156" width="7" height="14"/><rect x="106" y="156" width="7" height="14"/>
      <rect x="116" y="156" width="7" height="14"/><rect x="126" y="156" width="7" height="14"/>
    </g>

    <rect x="306" y="52" width="92" height="136" rx="10" fill="#24181a"/>
    <rect x="312" y="74" width="80" height="34" rx="4" fill="#3a2428"/>
    <rect x="316" y="150" width="72" height="26" rx="3" fill="#f2d02c"/>
    <g fill="#181818">
      <rect x="322" y="156" width="7" height="14"/><rect x="332" y="156" width="7" height="14"/>
      <rect x="344" y="156" width="7" height="14"/><rect x="354" y="156" width="7" height="14"/>
      <rect x="364" y="156" width="7" height="14"/><rect x="374" y="156" width="7" height="14"/>
    </g>

    <rect x="430" y="50" width="92" height="140" rx="10" fill="#161a22"/>
    <rect x="436" y="68" width="80" height="38" rx="4" fill="#2a3140"/>
    <rect x="440" y="152" width="72" height="26" rx="3" fill="#f2d02c"/>
    <g fill="#181818">
      <rect x="446" y="158" width="7" height="14"/><rect x="456" y="158" width="7" height="14"/>
      <rect x="468" y="158" width="7" height="14"/><rect x="478" y="158" width="7" height="14"/>
      <rect x="488" y="158" width="7" height="14"/><rect x="498" y="158" width="7" height="14"/>
    </g>

    <rect x="58" y="292" width="92" height="136" rx="10" fill="#1a2220"/>
    <rect x="64" y="310" width="80" height="34" rx="4" fill="#2c3a36"/>
    <rect x="68" y="390" width="72" height="26" rx="3" fill="#f2d02c"/>
    <g fill="#181818">
      <rect x="74" y="396" width="7" height="14"/><rect x="84" y="396" width="7" height="14"/>
      <rect x="96" y="396" width="7" height="14"/><rect x="106" y="396" width="7" height="14"/>
      <rect x="116" y="396" width="7" height="14"/><rect x="126" y="396" width="7" height="14"/>
    </g>

    <rect x="678" y="292" width="92" height="136" rx="10" fill="#181c26"/>
    <rect x="684" y="310" width="80" height="34" rx="4" fill="#2c3344"/>
    <rect x="688" y="390" width="72" height="26" rx="3" fill="#f2d02c"/>
    <g fill="#181818">
      <rect x="694" y="396" width="7" height="14"/><rect x="704" y="396" width="7" height="14"/>
      <rect x="716" y="396" width="7" height="14"/><rect x="726" y="396" width="7" height="14"/>
      <rect x="736" y="396" width="7" height="14"/><rect x="746" y="396" width="7" height="14"/>
    </g>
  </g>
  <!-- two pedestrians crossing the aisle: long sleeves, so the only skin-tone
       area is the head the redactor has to find -->
  <g>
    <rect x="212" y="248" width="34" height="56" rx="8" fill="#2f4a6b"/>
    <rect x="218" y="300" width="9" height="34" fill="#20262f"/>
    <rect x="231" y="300" width="9" height="34" fill="#20262f"/>
    <circle cx="229" cy="228" r="18" fill="#c68642"/>
    <g fill="#281c14">
      <rect x="221" y="223" width="5" height="4"/>
      <rect x="232" y="223" width="5" height="4"/>
      <rect x="224" y="236" width="10" height="3"/>
    </g>

    <rect x="580" y="252" width="34" height="56" rx="8" fill="#4a3f6b"/>
    <rect x="586" y="304" width="9" height="32" fill="#20262f"/>
    <rect x="599" y="304" width="9" height="32" fill="#20262f"/>
    <circle cx="597" cy="232" r="18" fill="#b57a52"/>
    <g fill="#281c14">
      <rect x="589" y="227" width="5" height="4"/>
      <rect x="600" y="227" width="5" height="4"/>
      <rect x="592" y="240" width="10" height="3"/>
    </g>
  </g>
</svg>
