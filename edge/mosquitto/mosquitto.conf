# The broker is a bus between two containers on one box, not a service.
# No listener on 0.0.0.0, no bridge to anywhere, nothing to log in to from
# outside: Frigate publishes, the ParkWiz bridge subscribes, that is all.
listener 1883
# Anonymous is safe only because this listener is unreachable from the LAN
# (no `ports:` for mosquitto in docker-compose.yml). If you ever publish the
# port — don't — add a password file here first.
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# Keep the on-box log small; occupancy history lives in ParkWiz, not here.
log_dest stdout
log_type warning
log_type error
connection_messages false
