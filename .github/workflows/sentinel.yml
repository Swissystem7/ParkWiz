name: ParkWiz Sentinel

# סוכן-ענן דטרמיניסטי: שומר האמת של ParkWiz.
# רץ יומית בענן (גם כשכל המחשבים כבויים) — אפס טוקני LLM.
on:
  schedule:
    - cron: '0 4 * * *'   # 07:00 ישראל, כל יום
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  issues: write

jobs:
  truth-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "בדיקה 1: אין רגרסיה של אירועים מזויפים אוטומטיים"
        run: |
          if grep -q "setInterval(liveParkingEvent" index.html; then
            echo "::error::REGRESSION: fake live events auto-timer is back!"
            exit 1
          fi
          echo "OK: no auto fake-events timer"

      - name: "בדיקה 2: קובץ הדאטה העירוני של נתניה תקין"
        run: |
          python3 - << 'EOF'
          import json
          for f in ['netanya-lots.geojson']:
              d = json.load(open(f, encoding='utf-8'))
              n = len(d.get('features', []))
              assert n > 0, f'{f}: empty!'
              print(f'OK: {f} — {n} features')
          EOF

      - name: "בדיקה 4: אין חזרה של טענות זמן-אמת (PW-004)"
        run: |
          if grep -E "בזמן אמת|נתון אמת|חניה חיה" index.html; then
            echo "::error::REGRESSION: 'real-time/live' product claims are back (violates truth-first)"
            exit 1
          fi
          echo "OK: no real-time claims — probabilistic wording only"

      - name: "בדיקה 5: החיזוי נשאר דטרמיניסטי (PW-005)"
        run: |
          python3 - << 'EOF'
          import re
          src = open('src/lib/predict.js', encoding='utf-8').read()
          assert 'function genHourlyPattern' in src, 'genHourlyPattern not found in src/lib/predict.js'
          code = '\n'.join(l for l in src.split('\n') if not l.strip().startswith('//'))
          assert 'Math.random' not in code, 'REGRESSION: prediction uses Math.random again!'
          assert not re.search(r'function genHourlyPattern', open('index.html', encoding='utf-8').read()), \
              'REGRESSION: genHourlyPattern was inlined back into index.html — it belongs in src/lib/predict.js'
          print('OK: prediction is deterministic and lives in one tested module')
          EOF

      - name: "בדיקה 6: מדד כנות — ספירת randomness"
        run: |
          n=$(grep -c "Math.random" index.html || true)
          echo "Math.random count: $n (Sprint-1 goal: shrink toward deterministic prediction)"
          echo "random_count=$n" >> "$GITHUB_STEP_SUMMARY"

      - name: "פתיחת Issue בכשל"
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Sentinel: בדיקת אמת נכשלה (${new Date().toISOString().slice(0,10)})`,
              body: `ריצת Sentinel נכשלה: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nצוות: Claude/Codex — לתקן לפי COORDINATION.md.`
            });
